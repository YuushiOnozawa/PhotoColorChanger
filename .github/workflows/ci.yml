name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: フォーマットチェック
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScriptチェック
        run: npm run typecheck

      - name: テスト
        run: npm run test:run

      - name: 本番ビルド
        run: npm run build
